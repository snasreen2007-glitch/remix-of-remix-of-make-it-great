<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a140e" />
      <stop offset="50%" stop-color="#0f2317" />
      <stop offset="100%" stop-color="#060c08" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Gold Accent -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Radial Soft Light -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Wave Filter -->
    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatLeaf {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(4deg); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-120px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes shimmer {
        0% { stop-color: #10b981; }
        50% { stop-color: #6ee7b7; }
        100% { stop-color: #10b981; }
      }
      .bg-pulse { animation: pulseLight 6s ease-in-out infinite; transform-origin: center; }
      .leaf-float { animation: floatLeaf 4s ease-in-out infinite; }
      .scanner-beam { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .shimmer-text { animation: shimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)" />
  <circle cx="600" cy="120" r="380" fill="url(#centerGlow)" class="bg-pulse" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Scanner Accent on Left Icon -->
  <g transform="translate(100, 60)" class="leaf-float">
    <!-- Icon Container Box -->
    <rect x="0" y="0" width="110" height="110" rx="30" fill="#eae6db" stroke="#10b981" stroke-width="2.5" opacity="0.95" />
    <!-- Plant Sprout Icon -->
    <path d="M55 24 C55 24, 40 42, 40 62 C40 76, 50 86, 55 88 C60 86, 70 76, 70 62 C70 42, 55 24, 55 24 Z" fill="#059669" />
    <path d="M55 45 C55 45, 68 40, 78 48 C86 54, 84 66, 76 70 C68 74, 58 68, 55 60" fill="#10b981" opacity="0.9" />
    <path d="M55 58 C55 58, 42 54, 34 60 C26 66, 28 78, 36 80 C44 82, 52 74, 55 68" fill="#34d399" opacity="0.85" />
    <line x1="55" y1="36" x2="55" y2="92" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Status Chip Pill -->
  <g transform="translate(240, 72)">
    <rect x="0" y="0" width="340" height="28" rx="14" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="32" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
      OFFLINE-FIRST ON-DEVICE EDGE AI
    </text>
  </g>

  <!-- Main Title: Kisan AI (Apple-Inspired SF Pro Display Typography) -->
  <text x="240" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Inter', sans-serif" font-size="62" font-weight="800" letter-spacing="-2">
    Kisan <tspan fill="url(#emeraldGlow)" font-weight="900">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="240" y="188" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="2.8">
    SMARTER WAYS, RICHER HARVESTS · REAL-FIELD FOLIAR DIAGNOSTICS
  </text>

  <!-- Subtitle Paragraph -->
  <text x="240" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    100% on-device vision pathology &amp; multilingual agronomic reasoning across Rice &amp; Chilli crops.
  </text>

  <!-- Technical Feature Pills Bottom Row -->
  <g transform="translate(240, 260)">
    <!-- Pill 1: MobileNetV3 -->
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="14" y="21" fill="#e2e8f0" font-family="monospace" font-size="11.5" font-weight="600">
      ⚡ MobileNetV3-Small
    </text>

    <!-- Pill 2: Llama 3.2 1B -->
    <rect x="192" y="0" width="180" height="34" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="206" y="21" fill="#e2e8f0" font-family="monospace" font-size="11.5" font-weight="600">
      🧠 Llama 3.2 1B (4-bit)
    </text>

    <!-- Pill 3: Anisotropy -->
    <rect x="384" y="0" width="190" height="34" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="398" y="21" fill="#e2e8f0" font-family="monospace" font-size="11.5" font-weight="600">
      🌿 18° Venation Filter
    </text>

    <!-- Pill 4: CIB&RC Statutory -->
    <rect x="586" y="0" width="180" height="34" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="600" y="21" fill="#e2e8f0" font-family="monospace" font-size="11.5" font-weight="600">
      🛡️ CIB&amp;RC Compliant
    </text>

    <!-- Pill 5: 6 Indic Languages -->
    <rect x="778" y="0" width="140" height="34" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="792" y="21" fill="#e2e8f0" font-family="monospace" font-size="11.5" font-weight="600">
      🇮🇳 6 Languages
    </text>
  </g>
</svg>
